[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "world-atlas-engine"
version = "1.4.0.dev9"
description = "Deterministic tectonic terrain and human-world atlas generation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "contourpy==1.3.3", "Pillow==12.3.0", "shapely==2.1.2"]

[project.scripts]
world-atlas = "world_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
world_atlas = ["data/*.json", "core/web/*.js", "core/web/*.css", "core/web/*.html", "core/web/*.txt"]
